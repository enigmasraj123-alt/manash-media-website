[build]
  command = "npm install && npm run build"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.web3forms.com https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://www.googletagmanager.com"
# Note: once you switch to the compiled Tailwind build (see README-DEPLOY.md),
# drop "https://cdn.tailwindcss.com" and "'unsafe-eval'" from script-src above —
# the compiled stylesheet needs neither, and removing them tightens this policy.
